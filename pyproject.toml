[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.1.0"
description = "A causal audit of forgetting and knowledge externalization in Limited Memory Language Models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.2",
    "matplotlib>=3.10.8",
    "numpy>=1.26,<2",
    # 2.10 matches the Co-LMLM environment. On Linux/aarch64 (DGX Spark,
    # GB10 = sm_121) it comes from the cu130 index below — PyPI's aarch64
    # wheels are CPU-only.
    "torch>=2.10,<2.11",
    "tqdm>=4.67.3",
    "transformers>=4.49,<4.50",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "sentence-transformers>=5.3.0",
    "faiss-cpu>=1.13.2",
    "requests>=2.32.5",
]

# litgpt is only needed to load the NULLs SeqTD checkpoints
# (src/models/nulls_wiki/vendor); the audit core never imports it. It is a
# *default* dependency group rather than an extra because the run scripts
# call a plain `uv sync` (exact by default), which would strip an extra
# that setup had installed — mid-run, under the cross-model scheduler,
# that would break every NULLs job starting after a Co-LMLM phase synced.
[dependency-groups]
nulls = ["litgpt>=0.5.12,<0.6"]

[tool.uv]
default-groups = ["nulls"]

# CUDA 13 torch for Linux/aarch64 only. x86_64 and macOS keep PyPI's torch
# (CUDA 12.8 on x86_64), so existing x86 GPU machines need no driver change.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[project.scripts]
halo-audit = "halo.run_audit:main"
halo-followups = "halo.analysis.followups:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
